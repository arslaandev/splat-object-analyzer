<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotated Splat Viewer</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.0.0/spark.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewport"></div>
  <div id="empty-hint"><p>Upload a Gaussian splat to find objects and their boxes.</p><button id="choose-scene">Choose .ply / .spz</button></div>
  <section id="analysis-status" class="hidden" aria-live="polite" aria-atomic="true">
    <strong id="analysis-title"></strong>
    <span id="analysis-detail"></span>
    <progress id="analysis-progress" aria-label="Analysis progress"></progress>
    <a id="download-results" class="hidden" download="interactions.json">Download results</a>
  </section>
  <section id="scene-understanding" class="hidden" aria-label="Scene understanding">
    <button id="understanding-toggle" type="button" aria-expanded="true" aria-controls="understanding-body">Explore this scene <span>⌄</span></button>
    <div id="understanding-body">
      <div id="scene-summary"></div>
      <div id="scene-groups" aria-label="Scene groups"></div>
      <form id="scene-prompt-form">
        <label for="scene-prompt">What would you like to show?</label>
        <textarea id="scene-prompt" rows="2" maxlength="1000" placeholder="Show off my desk setup"></textarea>
        <button id="scene-prompt-submit" type="submit">Find subjects &amp; views</button>
      </form>
      <div id="understanding-state" role="status" aria-live="polite"></div>
      <progress id="understanding-progress" class="hidden" aria-label="Scene understanding progress"></progress>
      <button id="understanding-retry" class="hidden" type="button">Retry</button>
      <div id="subject-selection"></div>
      <div id="suggested-views" aria-label="Suggested views"></div>
      <div class="understanding-actions">
        <button id="show-all-subjects" type="button">Show all labels</button>
        <button id="download-understanding" type="button">Download understanding</button>
      </div>
    </div>
  </section>
  <div id="navigation-hint">WASD move · Q/E down/up · Shift faster · Drag to look</div>
  <div id="loading" class="hidden" role="status" aria-live="polite">
    <div class="loading-bar-track">
      <div class="loading-bar-fill" id="loading-bar-fill"></div>
    </div>
    <span id="loading-label">Loading…</span>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
