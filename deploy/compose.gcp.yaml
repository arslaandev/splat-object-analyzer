services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cuda
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: ${SPLAT_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - splat-data:/data
      - splat-cache:/cache
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  splat-data:
  splat-cache:
